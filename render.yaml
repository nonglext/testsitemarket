services:
  - type: web
    name: market
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci
    startCommand: npm run migrate:deploy && npm run seed && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: market-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: market-cache, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_ORIGIN
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
  - type: keyvalue
    name: market-cache
    region: frankfurt
    plan: free
    ipAllowList: []
databases:
  - name: market-db
    region: frankfurt
    plan: free
    ipAllowList: []
